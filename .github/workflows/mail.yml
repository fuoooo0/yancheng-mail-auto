name: 邮箱账单自动入库

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-inbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 收信并写入待入库
        env:
          NETEASE_USER: ${{ secrets.NETEASE_USER }}
          NETEASE_PASS: ${{ secrets.NETEASE_PASS }}
          NETEASE_HOST: ${{ secrets.NETEASE_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SHOP_CODE: ${{ secrets.SHOP_CODE }}
          BILL_KEYWORDS: ${{ secrets.BILL_KEYWORDS }}
        run: python mail_to_inbox.py
